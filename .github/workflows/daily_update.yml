name: Daily Lottery Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright browser
        run: |
          pip install pandas playwright pypdf requests scipy
          playwright install --with-deps chromium

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f scratchcards.csv ]; then
            git add scratchcards.csv
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scratchcards with Bayesian model" && git push)
          else
            echo "Error: scratchcards.csv was not generated"
            exit 1
          fi
